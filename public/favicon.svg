<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#262626" stroke-width="1.5"/>

  <!-- Glowing fiber-optic wave arcs -->
  <!-- Outer arc -->
  <path d="M 14 26 A 26 26 0 0 1 50 26" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Middle arc -->
  <path d="M 21 34 A 17 17 0 0 1 43 34" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Core pulsing fiber core -->
  <circle cx="32" cy="44" r="5.5" fill="url(#emeraldGrad)"/>
  <circle cx="32" cy="44" r="2.5" fill="#ffffff"/>
  
  <!-- Optical pulse accent ray -->
  <path d="M 32 44 L 47 18" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="47" cy="18" r="3" fill="#22d3ee"/>
</svg>
